name: Issue 1016 native architecture integration
on:
  push:
    branches: [test/issue-1016-platforms]
    paths:
      - .github/workflows/issue-1016-integration.yml
      - .github/workflows/re-security-scan.yml
      - tests/re-security-scan/**
permissions:
  contents: read
  packages: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: |
          python -m pip install PyYAML==6.0.2
          python tests/re-security-scan/test_workflow.py
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish a controlled multiarch fixture
        run: |
          set -euo pipefail
          mkdir fixture
          cat > fixture/Dockerfile <<'EOF'
          ARG TARGETARCH
          FROM alpine:3.18.0 AS arm64
          FROM alpine:3.22 AS amd64
          FROM ${TARGETARCH}
          EOF
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t ghcr.io/nookyo/issue1016-fixture:main \
            -t ghcr.io/nookyo/issue1016-fixture:latest fixture
          docker buildx imagetools inspect ghcr.io/nookyo/issue1016-fixture:main
      - name: Seed the released legacy category for both tools
        run: |
          set -euo pipefail
          for tool in Grype Trivy; do
            jq -n --arg tool "$tool" '{version:"2.1.0",runs:[{
              tool:{driver:{name:$tool,version:"fixture",rules:[{id:"issue1016-legacy",shortDescription:{text:"Synthetic legacy migration fixture"}}]}},
              results:[{ruleId:"issue1016-legacy",message:{text:"Synthetic legacy fixture"},
                locations:[{physicalLocation:{artifactLocation:{uri:"README.md"},region:{startLine:1}}}]}]
            }]}' > "legacy-$tool.sarif"
          done
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          sarif_file: legacy-Grype.sarif
          category: issue1016-fixture
          wait-for-processing: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          sarif_file: legacy-Trivy.sarif
          category: issue1016-fixture
          wait-for-processing: true
  arm64:
    needs: fixture
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        tag: [main, latest]
    # Keep the supported local-call syntax until actionlint accepts $/ workflow calls.
    uses: ./.github/workflows/re-security-scan.yml # zizmor: ignore[self-repository]
    with:
      image: ghcr.io/nookyo/issue1016-fixture:${{ matrix.tag }}
      runner: ubuntu-24.04-arm
      grype-version: v0.118.0
      trivy-version: v0.76.0
      only-fixed: false
      continue-on-error: false
  amd64:
    needs: arm64
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        tag: [main, latest]
    # Keep the supported local-call syntax until actionlint accepts $/ workflow calls.
    uses: ./.github/workflows/re-security-scan.yml # zizmor: ignore[self-repository]
    with:
      image: ghcr.io/nookyo/issue1016-fixture:${{ matrix.tag }}
      grype-version: v0.118.0
      trivy-version: v0.76.0
      only-fixed: false
      continue-on-error: false
  verify:
    needs: amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: reports
          merge-multiple: true
      - name: Verify categories, legacy retirement and arm-only findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/code-scanning/analyses" \
            -f ref="$GITHUB_REF" -f per_page=100 | jq 'add' > analyses.json
          echo '| Tool | Category | SARIF results | GitHub results |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          for tool in Grype Trivy; do
            jq -e --arg tool "$tool" '[.[] | select(.tool.name == $tool and (.category | rtrimstr("/")) == "issue1016-fixture")][0] | .results_count == 0 and .error == ""' analyses.json
            for tag in main latest; do
              for arch in arm64 amd64; do
                category="issue1016-fixture:$tag@linux/$arch"
                file=$(find reports -name "${tool,,}-issue1016_fixture_${tag}_linux_${arch}*.sarif" | head -1)
                test -n "$file"
                count=$(jq '[.runs[].results[]] | length' "$file")
                actual=$(jq --arg tool "$tool" --arg category "$category" --arg sha "$GITHUB_SHA" \
                  '[.[] | select(.tool.name == $tool and (.category | rtrimstr("/")) == $category and .commit_sha == $sha and .error == "")][0].results_count // -1' analyses.json)
                test "$count" -eq "$actual"
                echo "| $tool | $category | $count | $actual |" >> "$GITHUB_STEP_SUMMARY"
                jq -r '.runs[].results[].ruleId' "$file" | sort -u > "$tool-$tag-$arch.rules"
              done
              rule=$(comm -23 "$tool-$tag-arm64.rules" "$tool-$tag-amd64.rules" | head -1)
              test -n "$rule"
              gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/code-scanning/alerts" \
                -f ref="$GITHUB_REF" -f tool_name="$tool" -f per_page=100 | jq 'add' > alerts.json
              number=$(jq -r --arg rule "$rule" '[.[] | select(.rule.id == $rule and .state == "open")][0].number // empty' alerts.json)
              test -n "$number"
              gh api "repos/$GITHUB_REPOSITORY/code-scanning/alerts/$number/instances" > instances.json
              jq -e --arg category "issue1016-fixture:$tag@linux/arm64" --arg ref "$GITHUB_REF" \
                'any(.[]; .ref == $ref and .state == "open" and (.category | rtrimstr("/")) == $category)' instances.json
              echo "PASS $tool $tag: arm64-only $rule remains open after amd64 uploaded (alert $number)" >> "$GITHUB_STEP_SUMMARY"
            done
          done
