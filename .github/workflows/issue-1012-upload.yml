name: Issue 1012 test upload
on:
  workflow_call:
    inputs:
      category:
        required: true
        type: string
      rule:
        required: true
        type: string
      finding:
        required: true
        type: boolean
      expected-state:
        required: true
        type: string
permissions:
  contents: read
  security-events: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Generate controlled SARIF
        env:
          RULE: ${{ inputs.rule }}
          FINDING: ${{ inputs.finding }}
        run: |
          jq -n --arg rule "$RULE" --argjson finding "$FINDING" '{
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            version: "2.1.0",
            runs: [{
              tool: {driver: {
                name: "Issue1012Test",
                version: "1.0.0",
                rules: [{id: $rule, shortDescription: {text: "Synthetic category isolation test"}}]
              }},
              results: (if $finding then [{
                ruleId: $rule,
                level: "warning",
                message: {text: "Synthetic test finding, not a real vulnerability"},
                locations: [{physicalLocation: {
                  artifactLocation: {uri: "README.md"},
                  region: {startLine: 1}
                }}],
                partialFingerprints: {primaryLocationLineHash: "1012abcdef:1"}
              }] else [] end)
            }]
          }' > test.sarif
      - name: Prepare downloadable artifact name
        id: artifact
        env:
          CATEGORY: ${{ inputs.category }}
          FINDING: ${{ inputs.finding }}
        run: |
          echo "name=${CATEGORY//:/_}-finding-${FINDING}" >> "$GITHUB_OUTPUT"
      - name: Save original SARIF for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: test.sarif
      - name: Upload using the production action version
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          sarif_file: test.sarif
          category: ${{ inputs.category }}
          wait-for-processing: true
      - name: Assert analysis category and alert state
        env:
          GH_TOKEN: ${{ github.token }}
          CATEGORY: ${{ inputs.category }}
          RULE: ${{ inputs.rule }}
          FINDING: ${{ inputs.finding }}
          EXPECTED_STATE: ${{ inputs.expected-state }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            gh api --method GET "repos/$GITHUB_REPOSITORY/code-scanning/analyses" \
              -f ref="$GITHUB_REF" -f tool_name=Issue1012Test -f per_page=100 > analyses.json
            gh api --method GET "repos/$GITHUB_REPOSITORY/code-scanning/alerts" \
              -f ref="$GITHUB_REF" -f tool_name=Issue1012Test -f per_page=100 > alerts.json
            analysis_ok=$(jq --arg category "$CATEGORY" --arg sha "$GITHUB_SHA" \
              --argjson finding "$FINDING" \
              '[.[] | select((.category | rtrimstr("/")) == $category and .commit_sha == $sha)][0]
              | . != null and .results_count == (if $finding then 1 else 0 end)' analyses.json)
            if [ "$EXPECTED_STATE" = absent ]; then
              alert_ok=$(jq --arg rule "$RULE" '[.[] | select(.rule.id == $rule)] | length == 0' alerts.json)
            else
              alert_ok=$(jq --arg rule "$RULE" --arg state "$EXPECTED_STATE" \
                '[.[] | select(.rule.id == $rule)] | length > 0 and all(.[]; .state == $state)' alerts.json)
            fi
            if [ "$analysis_ok" = true ] && [ "$alert_ok" = true ]; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              cat analyses.json alerts.json
              exit 1
            fi
            sleep 5
          done
          jq '[.[] | {id, category, results_count, commit_sha}]' analyses.json
          jq --arg rule "$RULE" '[.[] | select(.rule.id == $rule) | {number, state, rule: .rule.id, most_recent_instance}]' alerts.json
          for alert_number in $(jq -r --arg rule "$RULE" '.[] | select(.rule.id == $rule) | .number' alerts.json); do
            gh api "repos/$GITHUB_REPOSITORY/code-scanning/alerts/$alert_number/instances" \
              --jq '[.[] | {ref, state, category, analysis_key}]'
          done
          echo "PASS: $CATEGORY; finding=$FINDING; expected alert state=$EXPECTED_STATE" >> "$GITHUB_STEP_SUMMARY"
