name: Issue 1012 category experiment
on:
  push:
    branches: [test/issue-1012-sarif-categories]
    paths:
      - .github/workflows/issue-1012-test.yml
      - .github/workflows/issue-1012-upload.yml
permissions:
  contents: read
  security-events: write
jobs:
  shared-finding:
    uses: ./.github/workflows/issue-1012-upload.yml
    with:
      category: issue-1012-test-shared
      rule: shared-category
      finding: true
      expected-state: open
  shared-empty:
    needs: shared-finding
    uses: ./.github/workflows/issue-1012-upload.yml
    with:
      category: issue-1012-test-shared
      rule: shared-category
      finding: false
      expected-state: fixed
  split-latest:
    needs: shared-empty
    uses: ./.github/workflows/issue-1012-upload.yml
    with:
      category: issue-1012-test-split:latest
      rule: split-category
      finding: true
      expected-state: open
  split-main:
    needs: split-latest
    uses: ./.github/workflows/issue-1012-upload.yml
    with:
      category: issue-1012-test-split:main
      rule: split-category
      finding: false
      expected-state: open
  reverse-main:
    needs: split-main
    uses: ./.github/workflows/issue-1012-upload.yml
    with:
      category: issue-1012-test-reverse:main
      rule: reverse-category
      finding: false
      expected-state: absent
  reverse-latest:
    needs: reverse-main
    uses: ./.github/workflows/issue-1012-upload.yml
    with:
      category: issue-1012-test-reverse:latest
      rule: reverse-category
      finding: true
      expected-state: open
  split-fixed:
    needs: reverse-latest
    uses: ./.github/workflows/issue-1012-upload.yml
    with:
      category: issue-1012-test-split:latest
      rule: split-category
      finding: false
      expected-state: fixed
  reverse-fixed:
    needs: split-fixed
    uses: ./.github/workflows/issue-1012-upload.yml
    with:
      category: issue-1012-test-reverse:latest
      rule: reverse-category
      finding: false
      expected-state: fixed
